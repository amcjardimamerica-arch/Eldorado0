# Garantia do agendamento do Eldorado novo (22/10/2026): o agendador deste repositório funciona há semanas; o do
# repositório novo não registrou o agendamento depois de suspensões. A cada hora, este fluxo aciona a passagem do
# Eldorado novo (sem forçar a gravação do banco). Pode ser removido quando o agendamento próprio estiver confirmado.
name: "Acionar o Eldorado novo (garantia do agendamento)"
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  acionar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Acionar a passagem do Eldorado novo
        env:
          TOKEN: ${{ secrets.ELDORADO_NOVO_ACIONAR }}
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/amcjardimamerica-arch/Eldorado/actions/workflows/eldorado.yml/dispatches \
            -d '{"ref":"main","inputs":{"gravar_banco":"false","acionar_todos":"false"}}')
          echo "resposta do GitHub: $codigo"
          test "$codigo" = "204"
